<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLC Labeler</title>
    <link rel="stylesheet" href="/static/css/main.css?v=2">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body > .header { flex-shrink: 0; }

        /* Hide the sidebar scrollbar; it still scrolls by wheel/trackpad. */
        #sidebarScroll { scrollbar-width: none; -ms-overflow-style: none; }
        #sidebarScroll::-webkit-scrollbar { width: 0; height: 0; display: none; }

        /* Don't ring buttons on mouse click, only on keyboard focus. */
        button:focus:not(:focus-visible), .btn:focus:not(:focus-visible),
        select:focus:not(:focus-visible) { outline: none; box-shadow: none; }

        .sb-section {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-muted); margin: 14px 0 6px;
            border-bottom: 1px solid var(--border); padding-bottom: 3px;
        }
        .sb-section:first-child { margin-top: 0; }

        .row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .row + .row { margin-top: 5px; }
        .row label { color: var(--text-muted); cursor: pointer; display: flex;
                     align-items: center; gap: 5px; }
        .mini { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
        .sb-btn { width: 100%; margin-top: 5px; }

        .viewports { position: absolute; inset: 0; display: flex; }
        .vp-2d { position: relative; flex: 1; min-width: 0; }
        .vp-2d canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .grid-bar {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
            padding: 5px 10px; border-top: 1px solid var(--border);
            background: var(--bg-card);
        }
        .btn-warn {
            background: var(--orange); border-color: var(--orange);
            color: #2b1200; font-weight: 600;
        }

        /* Looking at a neighbouring frame is allowed and useful, but it
           must never be mistakable for the frame being labeled. */
        .vp-2d.off-target::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            border: 3px solid var(--orange); border-radius: 2px;
        }

        /* The guided grid: one row per point to place, one column per
         * selected frame, so "what is left to do" is one glance. */
        .grid-container {
            padding: 6px 10px 8px; overflow: auto; flex-shrink: 0;
            max-height: 30vh; background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        #pointGrid { display: grid; gap: 2px; width: max-content; }
        #pointGrid .rlabel {
            font-size: 10px; color: var(--text-muted); padding-right: 8px;
            white-space: nowrap; text-align: right; line-height: 15px;
        }
        #pointGrid .chdr {
            font-size: 8px; color: var(--text-muted); text-align: center;
            line-height: 11px;
        }
        #pointGrid .cell {
            width: 15px; height: 15px; border-radius: 2px; cursor: pointer;
            border: 1px solid var(--border); background: var(--bg);
        }
        #pointGrid .cell:hover { border-color: var(--blue); }
        #pointGrid .cell.done { background: var(--green); border-color: var(--green); }
        #pointGrid .cell.current {
            outline: 2px solid var(--blue); outline-offset: 1px;
        }
        .distance-trace-container { height: 110px; }

        .status-pill {
            font-size: 11px; padding: 1px 7px; border-radius: 9px;
            border: 1px solid var(--border); color: var(--text-muted);
        }
        .status-pill.dirty { border-color: var(--orange); color: #ffcc80; }
        .status-pill.saved { border-color: var(--green); color: #a5d6a7; }

        .toast {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 16px; font-size: 13px;
            z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,0.5); max-width: 70vw;
        }
        .toast.err { border-color: var(--red); color: #ffcdd2; }
        .toast.ok { border-color: var(--green); }
    </style>
</head>
<body data-subject-nav>
    <div class="header"></div>

    <div class="labeling-layout">
        <div class="labeling-sidebar">
            <div id="sidebarScroll" style="flex:1;min-height:0;overflow-y:auto;">

                <div class="sb-section">Session</div>
                <div class="label-count">This session: <strong id="labelCount">0</strong> frames</div>
                <div class="mini" id="committedCount"></div>
                <div class="mini" id="calibNote"></div>

                <div class="sb-section">Show</div>
                <div class="row">
                    <label title="Draw the MediaPipe hand landmarks over the frame. The guided zoom uses them either way.">
                        <input type="checkbox" id="showMpCb"> MediaPipe landmarks
                    </label>
                </div>

                <div class="sb-section">Shortcuts</div>
                <div class="shortcut-list" id="shortcutList"></div>
            </div>
        </div>

        <div class="labeling-main">
            <div class="canvas-container" id="canvasContainer">
                <div class="viewports">
                    <div class="vp-2d" id="vp2d">
                        <canvas id="labelCanvas" tabindex="0"></canvas>
                    </div>
                </div>
                <video id="videoPlayer" style="display:none;" muted preload="auto"></video>
            </div>

            <div class="controls-bar">
                <button class="btn btn-sm" id="playBtn" title="Play / pause (space)"
                        style="width:32px;">&#9654;</button>
                <input type="range" id="speedSlider" min="0" max="9" value="5"
                       style="width:84px;cursor:pointer;" title="Playback speed">
                <span id="speedLabel" style="font-size:11px;color:var(--blue);min-width:30px;">1x</span>
                <span class="frame-display" id="frameDisplay"
                      title="Click to switch between frame number, time, and both"
                      style="cursor:pointer;">Frame 0 / 0</span>
                <span id="sideToggle" class="side-toggle os" title="Switch camera (E)">OS</span>
                <button class="btn btn-sm" id="resetZoomBtn" title="Reset zoom (R)">Fit</button>
                <span class="status-pill" id="savePill">saved</span>
                <span id="labelInfo" style="font-size:12px;color:var(--text-muted);margin-left:auto;"></span>
            </div>

            <div class="grid-bar">
                <button class="btn btn-sm" id="nextPointBtn"
                        title="Jump to the next point nobody has placed yet (N)">Next point (N)</button>
                <button class="btn btn-sm btn-warn" id="backToTargetBtn" style="display:none;"
                        title="Return to the frame being labeled, keeping your zoom (B)">Back to target (B)</button>
                <label class="mini" style="display:flex;align-items:center;gap:4px;cursor:pointer;"
                       title="Move to the next point as soon as you place one, instead of waiting for N">
                    <input type="checkbox" id="autoAdvanceCb"> advance automatically
                </label>
                <span class="mini" id="guidedStatus"></span>
                <button class="btn btn-sm" id="exportBtn" style="margin-left:auto;"
                        title="Write these frames as a folder to send to someone else to label">Export for labeling</button>
                <button class="btn btn-sm btn-success" id="commitBtn">Save labels</button>
            </div>

            <div class="grid-container" id="gridContainer">
                <div id="pointGrid"></div>
            </div>

            <div class="distance-trace-container" id="traceContainer">
                <div class="distance-trace-label" id="traceLabel"></div>
                <canvas id="traceCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="/static/js/nav.js?v=3"></script>
    <script src="/static/js/label.js?v=12" type="module"></script>
</body>
</html>
